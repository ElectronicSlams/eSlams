[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eslams-core"
version = "0.3.2"
description = "Public eSlams framework for AI game agents, deterministic runs, artifacts, and replays."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ElectronicSlams" }]
keywords = ["ai", "evals", "agents", "games", "leaderboards", "replays"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-chess>=1.999,<2",
  "cryptography>=42,<47"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
  "twine>=5,<7"
]

[project.urls]
Homepage = "https://github.com/ElectronicSlams/eSlams"
Issues = "https://github.com/ElectronicSlams/eSlams/issues"

[project.scripts]
eslams = "eslams.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eslams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP006", "UP007"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
exclude = ["build", "dist"]
