[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "eslams-core"
version = "0.6.1"
description = "Public eSlams framework for AI game agents, deterministic runs, artifacts, and replays."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ElectronicSlams" }]
keywords = ["ai", "evals", "agents", "games", "leaderboards", "replays"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "httpx>=0.28.1,<1",
  "fastapi>=0.142.4,<1",
  "starlette>=1.7.0,<2",
  "uvicorn[standard]>=0.54.0,<1",
  "python-chess>=1.999,<2",
  "cryptography>=50.0.2,<51"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=5,<7",
  "jsonschema>=4.23,<5",
  "ruff>=0.6,<1",
  "mypy>=1.10,<1.20",
  "build>=1.6.1,<2",
  "twine>=7,<8",
  "setuptools>=83,<84"
]

[project.urls]
Homepage = "https://github.com/ElectronicSlams/eSlams"
Issues = "https://github.com/ElectronicSlams/eSlams/issues"

[project.scripts]
eslams = "eslams.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eslams", "src/eslams_core"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP006", "UP007"]

[tool.mypy]
# Match the active interpreter; CI also checks every supported Python version.
strict = true
warn_unused_ignores = true
exclude = ["build", "dist"]
