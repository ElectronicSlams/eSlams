name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    paths: ["pyproject.toml", ".github/workflows/dependency-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    name: Python ${{ matrix.python }} / ${{ matrix.resolution }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        resolution: [current, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: target
        with:
          python-version: ${{ matrix.python }}
      - name: Install current target dependencies
        run: python -m pip install -e ".[dev]"
      - name: Select declared direct floors
        if: matrix.resolution == 'minimum'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.version import Version
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          requirements = project["dependencies"] + project["optional-dependencies"]["dev"]
          constraints = []
          for raw in requirements:
              requirement = Requirement(raw)
              if requirement.marker and not requirement.marker.evaluate():
                  continue
              floors = [Version(spec.version) for spec in requirement.specifier if spec.operator in (">=", "==")]
              if not floors:
                  raise SystemExit(f"No explicit floor for {requirement.name}")
              constraints.append(f"{requirement.name}=={max(floors)}")
          Path("minimum-constraints.txt").write_text("\n".join(constraints) + "\n", encoding="utf-8", newline="\n")
          PY
          python -m pip install -e ".[dev]" --constraint minimum-constraints.txt
      - name: Verify behavior at selected resolution
        run: python -m pytest --basetemp="${{ runner.temp }}/eslams-pytest"
      # The patched CacheControl filelock backend requires >=3.11. Audit the
      # actual matrix interpreter's packages without adding the tool to them.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit target and tooling without advisory suppression
        env:
          TARGET_PYTHON: ${{ steps.target.outputs.python-path }}
        run: |
          set -eu
          target_site="$("$TARGET_PYTHON" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          test -d "$target_site"
          python -m venv "$RUNNER_TEMP/eslams-auditor"
          audit_python="$RUNNER_TEMP/eslams-auditor/bin/python"
          "$audit_python" -m pip install "pip==26.3" "pip-audit==2.10.1" "filelock==4.2.1"
          "$audit_python" -m pip_audit --path "$target_site"
          "$audit_python" -m pip_audit --local
