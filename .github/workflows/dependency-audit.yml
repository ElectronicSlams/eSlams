name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    paths: ["pyproject.toml", ".github/workflows/dependency-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    name: Python ${{ matrix.python }} / ${{ matrix.resolution }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        resolution: [current, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install current dependencies and audit tool
        run: python -m pip install -e ".[dev]" pip-audit==2.10.1
      - name: Select declared direct floors
        if: matrix.resolution == 'minimum'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.version import Version
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          requirements = project["dependencies"] + project["optional-dependencies"]["dev"]
          constraints = []
          for raw in requirements:
              requirement = Requirement(raw)
              if requirement.marker and not requirement.marker.evaluate():
                  continue
              floors = [Version(spec.version) for spec in requirement.specifier if spec.operator in (">=", "==")]
              if not floors:
                  raise SystemExit(f"No explicit floor for {requirement.name}")
              constraints.append(f"{requirement.name}=={max(floors)}")
          Path("minimum-constraints.txt").write_text("\n".join(constraints) + "\n", encoding="utf-8", newline="\n")
          PY
          python -m pip install -e ".[dev]" --constraint minimum-constraints.txt
      - name: Verify behavior at selected resolution
        run: python -m pytest --basetemp="${{ runner.temp }}/eslams-pytest"
      - name: Audit without advisory suppression
        run: python -m pip_audit --local
