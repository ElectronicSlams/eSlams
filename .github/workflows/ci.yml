name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --basetemp="${{ runner.temp }}/eslams-pytest"
      - name: Schema export smoke
        run: eslams schemas export --out "${{ runner.temp }}/eslams-schemas"
      - name: Core benchmark smoke
        run: python -m eslams_core.bench arena-step --games tic-tac-toe --iterations 10 --json "${{ runner.temp }}/core-step-bench.json"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --python-version ${{ matrix.python-version }} src

  typescript:
    name: TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Type-check core-contracts
        run: npx --yes --package typescript@5.5.4 tsc --noEmit -p packages/core-contracts/tsconfig.json
      - name: Type-check core-lite
        run: npx --yes --package typescript@5.5.4 tsc --noEmit -p packages/core-lite/tsconfig.json
