name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --basetemp="${{ runner.temp }}/eslams-pytest"
      - name: Versioned arena behavior fingerprints
        run: python scripts/verify_arena_versions.py
      - name: Initial-state observation and prompt budgets
        run: eslams core budgets --json
      - name: Schema export smoke
        run: eslams schemas export --out "${{ runner.temp }}/eslams-schemas"
      - name: Core benchmark smoke
        run: python -m eslams_core.bench arena-step --games tic-tac-toe --iterations 10 --json "${{ runner.temp }}/core-step-bench.json"
      - name: Deterministic artifact and schema bytes
        run: python scripts/verify_portable_bytes.py --output "${{ runner.temp }}/portable-bytes/hashes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deterministic-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/portable-bytes/hashes.json
          if-no-files-found: error
          retention-days: 7
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --python-version ${{ matrix.python-version }} src

  portable-bytes:
    name: Native deterministic byte parity
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deterministic-*
          path: ${{ runner.temp }}/portable-bytes
      - name: Compare five native environments
        run: python scripts/verify_portable_bytes.py --compare "${{ runner.temp }}/portable-bytes"

  replay-browser:
    name: Replay browser regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/replay-node" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/replay-node/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Generate validated keyless replay pages
        run: python scripts/generate_replay_fixtures.py "${{ runner.temp }}/replay-pages"
      - name: Verify all arenas at mobile, tablet and desktop sizes
        env:
          NODE_PATH: ${{ runner.temp }}/replay-node/node_modules
        run: node scripts/verify_replay_browser.cjs "${{ runner.temp }}/replay-pages"

  typescript:
    name: TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Type-check core-contracts
        run: npx --yes --package typescript@5.5.4 tsc --noEmit -p packages/core-contracts/tsconfig.json
      - name: Type-check core-lite
        run: npx --yes --package typescript@5.5.4 tsc --noEmit -p packages/core-lite/tsconfig.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python authority
        run: python -m pip install -e .
      - name: Compile Core-lite for parity
        run: |
          npx --yes --package typescript@5.5.4 tsc -p packages/core-lite/tsconfig.json --noEmit false --outDir "${{ runner.temp }}/core-lite-parity"
          python -c 'import pathlib; pathlib.Path("${{ runner.temp }}/core-lite-parity/package.json").write_text("{\"type\":\"module\"}", encoding="utf-8")'
      - name: Verify Python and Core-lite deterministic parity
        run: python scripts/verify_core_lite.py "${{ runner.temp }}/core-lite-parity/core-lite/src/index.js"
