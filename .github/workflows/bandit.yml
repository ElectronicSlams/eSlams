name: Bandit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. Offset from pip-audit (Monday 06:23 UTC, #44) and CodeQL
    # (Monday 07:41 UTC, #41) so the jobs do not start together.
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit scan of src
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan src at medium severity and above
        run: |
          # Severity gate is -ll (MEDIUM and HIGH). LOW is not a failure on
          # this tree: a full scan reports 49 low findings and no high ones.
          # Those lows are game RNG (B311), card and action words flagged as
          # passwords (B105), asserts (B101), and git subprocess calls in
          # build provenance (B404, B603, B607).
          #
          # The only medium findings on current main are B104
          # (hardcoded_bind_all_interfaces) at:
          #   src/eslams/agent/server.py AgentServer.run host default
          #   src/eslams/cli.py `eslams agent serve --host` default
          # Both are the sample-agent 0.0.0.0 defaults. Draft #26 (F8) changes
          # those defaults to 127.0.0.1. This workflow does not edit that code.
          # Skip B104 so every other medium and high test still fails the job.
          # After #26 is on main, drop --skip B104 and re-scan; the remaining
          # 0.0.0.0 text there is the documented opt-in, not a default.
          bandit -r src -ll --skip B104
