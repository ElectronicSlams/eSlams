name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish, usually a version tag like v0.6.1"
        required: true
        default: "v0.6.1"

permissions:
  contents: read

jobs:
  pypi:
    name: Build and publish eslams-core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve publish ref
        id: publish-ref
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os

          ref = os.environ.get("INPUT_REF") or os.environ.get("RELEASE_TAG") or os.environ["GITHUB_REF_NAME"]
          if not ref or any(char in ref for char in "\r\n"):
              raise SystemExit("publish ref must be a single line")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"ref={ref}\n")
          PY

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publish-ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        shell: bash
        env:
          PUBLISH_REF: ${{ steps.publish-ref.outputs.ref }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          ref = os.environ["PUBLISH_REF"]
          tag = ref.removeprefix("refs/tags/").split("/")[-1]
          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          expected_tag = f"v{version}"
          if tag != expected_tag:
              print(
                  f"Publish ref {ref!r} does not match pyproject.toml version "
                  f"{version!r}; expected tag {expected_tag!r}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
