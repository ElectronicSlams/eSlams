name: Publish verified server distributions

# Corrective publisher-only dispatch. Source/tag/package bytes stay immutable.
# Requires explicit approval for this job-local draft-access permission and rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-eslams-core-0.7.0
  cancel-in-progress: false

jobs:
  pypi:
    name: Publish previously verified 0.7.0 files
    if: github.repository == 'ElectronicSlams/eSlams' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Proposed draft-access recovery; broader job token; no repository writes executed.
      contents: write
      id-token: write
    env:
      # Artifact-source identity is separate from github.sha (publisher-control identity).
      SOURCE_COMMIT: 120847e60ffd3acc06fc17ad71d3b1413665163e
      RELEASE_ID: "433491656"
      ASSET_ID: "708125397"
      BUNDLE_SHA256: caaa9ba6f51b465c659f0b7affe04cee566ad0e8c7544e7cce8bb1556aba1b3f
    steps:
      - name: Read the exact reviewed verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 120847e60ffd3acc06fc17ad71d3b1413665163e
          persist-credentials: false

      - name: Fetch and verify server artifacts without executing package code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == ElectronicSlams/eSlams ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          echo "Publisher-control commit: $GITHUB_SHA"
          echo "Verified artifact-source commit: $SOURCE_COMMIT"
          metadata="$RUNNER_TEMP/eslams-release.json"
          bundle="$RUNNER_TEMP/eslams-server-bundle.zip"
          echo "Resolve immutable package tag"
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.7.0" --jq .sha)"
          echo "Read selected draft release metadata"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$metadata"
          common=(--release-json "$metadata" --release-id "$RELEASE_ID" --asset-id "$ASSET_ID"
                  --tag v0.7.0 --commit "$SOURCE_COMMIT" --remote-commit "$remote_commit")
          python3 -I scripts/verify_publish_bundle.py "${common[@]}"
          echo "Download selected verified server bundle"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            --header 'Accept: application/octet-stream' > "$bundle"
          python3 -I scripts/verify_publish_bundle.py "${common[@]}" \
            --bundle "$bundle" --bundle-sha256 "$BUNDLE_SHA256" \
            --out "$GITHUB_WORKSPACE/.publish-verified-dist"
          status="$(curl --silent --show-error --max-time 30 \
            --output "$RUNNER_TEMP/eslams-pypi-before.json" --write-out '%{http_code}' \
            https://pypi.org/pypi/eslams-core/0.7.0/json)"
          [[ "$status" == 404 ]] || {
            echo 'PyPI version is present or its absence is unverified; stop for reconciliation.'
            exit 1
          }

      # No dependency install, package build, package import or test execution here.
      # The pinned publisher authenticates through the existing PyPI OIDC trust.
      - name: Publish exactly the verified distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: .publish-verified-dist/
          skip-existing: false
