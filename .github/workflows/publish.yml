name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish, usually a version tag like v0.6.1"
        required: true
        default: "v0.6.1"

permissions:
  contents: read

jobs:
  pypi:
    name: Build and publish eslams-core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve publish ref
        id: publish-ref
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.publish-ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        shell: bash
        env:
          PUBLISH_REF: ${{ steps.publish-ref.outputs.ref }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          ref = os.environ["PUBLISH_REF"]
          tag = ref.removeprefix("refs/tags/").split("/")[-1]
          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          expected_tag = f"v{version}"
          if tag != expected_tag:
              print(
                  f"Publish ref {ref!r} does not match pyproject.toml version "
                  f"{version!r}; expected tag {expected_tag!r}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
