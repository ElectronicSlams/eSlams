name: Publish verified server distributions

# Explicit publisher-only dispatch of exact reviewed 0.8.1 package bytes.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Draft GitHub release ID containing the verified bundle"
        required: true
      asset_id:
        description: "ID of eslams-core-0.8.1-publish.zip on that draft release"
        required: true
      bundle_sha256:
        description: "Independently verified SHA256 of the complete handoff bundle"
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-eslams-core-0.8.1
  cancel-in-progress: false

jobs:
  pypi:
    name: Publish previously verified 0.8.1 files
    if: github.repository == 'ElectronicSlams/eSlams' && github.ref == 'refs/tags/v0.8.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Retain existing draft-asset access; no repository writes are performed.
      contents: write
      id-token: write
    steps:
      - name: Read the exact reviewed verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch and verify server artifacts without executing package code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_ID: ${{ inputs.asset_id }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == ElectronicSlams/eSlams ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/tags/v0.8.1 ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Publisher identity/input gate failed" >&2; exit 1; }
          echo "Verified artifact-source commit: $GITHUB_SHA"
          metadata="$RUNNER_TEMP/eslams-release.json"
          bundle="$RUNNER_TEMP/eslams-server-bundle.zip"
          echo "Resolve immutable package tag"
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/v0.8.1" --jq .sha)"
          echo "Read selected draft release metadata"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$metadata"
          common=(--release-json "$metadata" --release-id "$RELEASE_ID" --asset-id "$ASSET_ID"
                  --tag v0.8.1 --commit "$GITHUB_SHA" --remote-commit "$remote_commit")
          python3 -I scripts/verify_publish_bundle.py "${common[@]}"
          echo "Download selected verified server bundle"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            --header 'Accept: application/octet-stream' > "$bundle"
          python3 -I scripts/verify_publish_bundle.py "${common[@]}" \
            --bundle "$bundle" --bundle-sha256 "$BUNDLE_SHA256" \
            --out "$GITHUB_WORKSPACE/.publish-verified-dist"
          status="$(curl --silent --show-error --max-time 30 \
            --output "$RUNNER_TEMP/eslams-pypi-before.json" --write-out '%{http_code}' \
            https://pypi.org/pypi/eslams-core/0.8.1/json)"
          [[ "$status" == 404 ]] || {
            echo 'PyPI version is present or its absence is unverified; stop for reconciliation.'
            exit 1
          }

      # No dependency install, package build, package import or test execution here.
      # The pinned publisher authenticates through the existing PyPI OIDC trust.
      - name: Publish exactly the verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .publish-verified-dist/
          skip-existing: false
