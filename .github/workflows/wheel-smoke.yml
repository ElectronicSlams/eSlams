name: Distribution consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consumers:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build --outdir "${{ runner.temp }}/eslams-dist"
      - name: Check distribution metadata
        run: python -m twine check "${{ runner.temp }}/eslams-dist/*"
      - name: Verify isolated wheel and sdist consumers
        run: python scripts/verify_distributions.py --dist "${{ runner.temp }}/eslams-dist" --expected-commit "${{ github.sha }}"
