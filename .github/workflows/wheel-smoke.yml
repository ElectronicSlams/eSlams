name: Distribution consumers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consumers:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"
      - name: Build distributions
        run: python -m build --outdir "${{ runner.temp }}/eslams-dist"
      - name: Check distribution metadata
        run: python -m twine check "${{ runner.temp }}/eslams-dist/*"
      - name: Verify isolated wheel and sdist consumers
        run: python scripts/verify_distributions.py --dist "${{ runner.temp }}/eslams-dist" --expected-commit "${{ github.sha }}"
